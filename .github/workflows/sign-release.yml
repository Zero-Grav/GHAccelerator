name: sign-release

# 正式代码签名需要 OV/EV 证书。此工作流仅为模板：
# 手动触发 + 必须配置 secrets；未配置时第一步明确失败并给出指引，
# 不会静默产出「看起来已签名」的产物。详见 docs/RELEASE.md。
on:
  workflow_dispatch:
    inputs:
      exe_path:
        description: '待签名 exe（相对于工作区根目录）'
        required: true
        default: 'GHAccelerator-portable.exe'

permissions:
  contents: read

jobs:
  sign:
    runs-on: windows-latest
    steps:
      - name: Guard - certificate secrets must exist
        shell: bash
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "$PFX_B64" ] || [ -z "$PFX_PASS" ]; then
            echo "::error::缺少 WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD。请在 Settings > Secrets 配置，或按 docs/RELEASE.md 本地签名。"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Decode PFX into runner temp
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX_B64))

      - name: Sign with RFC3161 timestamp
        shell: pwsh
        env:
          PFX_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          EXE: ${{ inputs.exe_path }}
        run: |
          $st = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Select-Object -First 1).FullName
          if (-not $st) { throw "signtool.exe not found" }
          & $st sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASS /fd sha256 /tr http://timestamp.digicert.com /td sha256 $env:EXE
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }
          & $st verify /pa /v $env:EXE
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed" }

      - name: SHA256 of signed artifact
        shell: pwsh
        env:
          EXE: ${{ inputs.exe_path }}
        run: Get-FileHash $env:EXE -Algorithm SHA256 | Format-List

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-exe
          path: ${{ inputs.exe_path }}

      - name: Remove certificate from runner
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\cert.pfx" -ErrorAction SilentlyContinue
